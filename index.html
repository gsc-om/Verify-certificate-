<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Scaffolding & Certifications - Certificate Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .result p {
            margin: 8px 0;
            font-size: 15px;
            color: #444;
        }
        .error {
            color: red;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>GSC Certificate Verification</h2>
    <div class="search-box">
        <input type="text" id="certId" placeholder="Enter Certificate ID...">
        <button onclick="verifyCertificate()">Verify</button>
    </div>
    
    <div id="resultContainer" class="result" style="display: none;">
        <!-- ডাটা এখানে শো করবে -->
    </div>
</div>

<script>
    // আপনার নতুন ডিপ্লয়কৃত ব্যাকএন্ড ওয়েব অ্যাপ ইউআরএল
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHvELPnCLnh2n1FPZH0cDpaRfwHpQtdnip3vO9DUQjRwRTKYu-dImhcmIN1LSf8hUh/exec";

    function verifyCertificate() {
        const id = document.getElementById('certId').value.trim();
        const resultContainer = document.getElementById('resultContainer');
        
        if (id == "") {
            alert("Please enter a valid ID!");
            return;
        }

        resultContainer.style.display = 'block';
        resultContainer.innerHTML = "<p style='text-align:center;'>Searching...</p>";

        fetch(`${SCRIPT_URL}?id=${id}`)
            .then(response => response.json())
            .then(data => {
                if (data && data.ID) {
                    let html = `<h3>Certificate Details</h3>`;
                    for (const key in data) {
                        if (data.hasOwnProperty(key)) {
                            html += `<p><strong>${key}:</strong> ${data[key]}</p>`;
                        }
                    }
                    resultContainer.innerHTML = html;
                } else {
                    resultContainer.innerHTML = `<p class="error">Certificate not found!</p>`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                resultContainer.innerHTML = `<p class="error">Failed to fetch data. Please try again.</p>`;
            });
    }
</script>

</body>
</html>
